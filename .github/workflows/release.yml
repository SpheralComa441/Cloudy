name: Publish Cloudy Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Publish GitHub Release Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" Cloudy.exe Crea-Shortcut-Desktop.bat --clobber
          else
            gh release create "$TAG" Cloudy.exe Crea-Shortcut-Desktop.bat \
              --title "Cloudy ${TAG} — Claude Desktop G-Sync Flicker Fix Launcher" \
              --notes "### Cloudy ${TAG}

          Ultra-lightweight (~20 KB) native Windows x64 launcher that automatically locates the latest installed version of **Claude Desktop** (\`WindowsApps\` MSIX or \`AppData\`) without requiring Administrator privileges and launches it with \`--disable-gpu-compositing\` to eliminate G-Sync / FreeSync flickering.

          #### Assets
          - **\`Cloudy.exe\`** — Standalone native Windows executable (0 dependencies, 0 MB background RAM, no console window flash).
          - **\`Crea-Shortcut-Desktop.bat\`** — Optional helper to create a Desktop shortcut using the official icon from your installed \`claude.exe\`."
          fi
