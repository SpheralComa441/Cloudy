name: Build & Release Cloudy

# - Every push to main and every pull request: build Cloudy.exe from source (build check).
# - Tag push (v*) or manual run with a tag: build from source and publish the GitHub Release.
#   The released Cloudy.exe is always the one built here from src/cloudy.c, never the
#   binary committed in the repository.
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create or update (e.g. v1.1.0)'
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Clang/LLD toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld llvm

      - name: Build Cloudy.exe from source
        run: bash scripts/build.sh

      - name: Verify executable
        run: |
          file Cloudy.exe
          file Cloudy.exe | grep -q 'PE32+ executable (GUI) x86-64'
          sha256sum Cloudy.exe | tee Cloudy.exe.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cloudy
          path: |
            Cloudy.exe
            Cloudy.exe.sha256
            Crea-Shortcut-Desktop.bat
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: Cloudy

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          # Tag push: the pushed tag. Manual run: the tag given as input (never the branch name).
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          case "$TAG" in
            v*) ;;
            *) echo "::error::Release tag must start with 'v' (got '$TAG')"; exit 1 ;;
          esac

          ASSETS="Cloudy.exe Cloudy.exe.sha256 Crea-Shortcut-Desktop.bat"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $ASSETS --clobber
          else
            gh release create "$TAG" $ASSETS \
              --target "$GITHUB_SHA" \
              --title "Cloudy ${TAG} — Claude Desktop G-Sync Flicker Fix Launcher" \
              --notes "### Cloudy ${TAG}

          Ultra-lightweight native Windows x64 launcher that automatically locates the latest installed version of **Claude Desktop** (\`WindowsApps\` MSIX or \`AppData\`) without requiring Administrator privileges and launches it with \`--disable-gpu-compositing\` to eliminate G-Sync / FreeSync flickering.

          After launching, Cloudy waits in the background (0% CPU) and, if Claude auto-updates and restarts without the flag, relaunches it with \`--disable-gpu-compositing\`. Use \`Cloudy.exe --no-watch\` to exit right after launch.

          #### Assets
          - **\`Cloudy.exe\`** — Standalone native Windows executable built from source by this workflow (0 dependencies, no console window flash).
          - **\`Cloudy.exe.sha256\`** — SHA-256 checksum of \`Cloudy.exe\`.
          - **\`Crea-Shortcut-Desktop.bat\`** — Optional helper to create a \`Claude.lnk\` Desktop shortcut that points to Cloudy."
          fi
